<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>OwnFormatters Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages & static fallbacks
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      var knownTools = [
        'home', 'json-formatter', 'json-validator', 'json-beautifier', 'json-schema-generator', 'json-schema-validator',
        'jsonpath-tester', 'jsonpath-evaluator', 'yaml-converter', 'yaml-formatter', 'yaml-to-json', 'json-to-yaml',
        'xml-formatter', 'xml-beautifier', 'xml-to-json', 'json-to-xml', 'sql-formatter', 'sql-beautifier',
        'code-minifier', 'html-minifier', 'css-minifier', 'js-minifier', 'api-tester', 'rest-api-tester',
        'graphql-tester', 'graphql-client', 'openapi-viewer', 'swagger-viewer', 'webhook-tester', 'mock-api-server',
        'docker-compose-validator', 'docker-validator', 'k8s-yaml-validator', 'kubernetes-validator',
        'nginx-config-formatter', 'nginx-formatter', 'base64-encoder', 'base64-decoder', 'base64-encoder-decoder',
        'base64-decode', 'base64-encode', 'url-encoder', 'url-decoder', 'url-encoder-decoder', 'jwt-debugger',
        'jwt-decoder', 'jwt-parser', 'timestamp-converter', 'epoch-converter', 'unix-timestamp-converter',
        'text-utility', 'hash-generator', 'md5-generator', 'sha256-generator', 'uuid-generator', 'guid-generator',
        'qrcode-generator', 'qr-code-generator', 'markdown-editor', 'markdown-previewer', 'csv-converter',
        'csv-to-json', 'json-to-csv', 'csv-json-converter', 'color-converter', 'hex-to-rgb', 'rgb-to-hex',
        'number-base-converter', 'binary-converter', 'hex-converter', 'cron-parser', 'cron-tester',
        'cron-expression-descriptor', 'regex-tester', 'regex-checker', 'text-diff', 'diff-checker', 'diff-tool',
        'privacy-policy', 'privacy', 'terms-of-service', 'terms', 'about-us', 'about',
        'indexnow-submitter', 'indexnow', 'json-to-code', 'json-to-typescript', 'json-to-types',
        'learn-json', 'learn-jsonschema', 'learn-jsonpath', 'learn-jsontocode', 'learn-yaml', 'learn-xml',
        'learn-sql', 'learn-jwt', 'learn-regex', 'learn-cron', 'learn-timestamp', 'learn-base64',
        'learn-url', 'learn-hash', 'learn-uuid', 'learn-qrcode', 'learn-markdown', 'learn-csv',
        'learn-color', 'learn-base', 'learn-diff', 'learn-api', 'learn-graphql', 'learn-openapi',
        'learn-webhook', 'learn-mockapi', 'learn-docker', 'learn-k8s', 'learn-nginx'
      ];
      var l = window.location;
      var firstSegment = l.pathname.split('/')[1];
      var pathSegmentsToKeep = (l.hostname.endsWith('.github.io') && knownTools.indexOf(firstSegment) === -1 && firstSegment !== '') ? 1 : 0;
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    Redirecting you back to the application...
  </body>
</html>
